<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トレサ表メーカー</title>
<style>
/* 画面：左に操作パネル、右にA4横の印刷プレビュー。印刷時はプレビューのシートだけを出す */
:root{
  --ink:#1d1a19; --muted:#6f6763; --line:#d9d2cf; --panel:#f6f3f2; --bg:#ebe7e5;
  --red:#a61c00; --red-deep:#980000; --warn:#b3261e; --warn-bg:#fdecea; --ok:#2e6b3a;
  --jp:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Meiryo",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--jp);color:var(--ink);background:var(--bg);font-size:14px}
.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
.panel{background:var(--panel);border-right:1px solid var(--line);padding:20px 18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.panel h1{font-size:19px;margin:0;letter-spacing:.02em}
.panel h1 small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:4px}
.step{display:flex;flex-direction:column;gap:8px}
.step>label.t{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.drop{border:2px dashed #bdb3af;border-radius:8px;padding:16px 12px;text-align:center;background:#fff;cursor:pointer;line-height:1.6}
.drop.on{border-color:var(--red);background:#fff6f4}
.drop b{color:var(--red)}
.fname{font-size:12px;color:var(--muted);word-break:break-all}
.row2{display:flex;gap:8px;align-items:center}
.row2 input[type=date]{flex:1;min-width:0;padding:6px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
.stores{display:flex;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px}
.stores label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:5px;cursor:pointer}
.stores label:hover{background:var(--panel)}
.stores .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.stores .none{color:#a39a96}
.btn{appearance:none;border:0;border-radius:8px;padding:12px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn.primary{background:var(--red);color:#fff;font-size:16px}
.btn.primary:disabled{background:#c9bfbc;cursor:not-allowed}
.btn.sub{background:#fff;border:1px solid var(--line);color:var(--ink);padding:6px 10px;font-weight:400;font-size:12px}
.btn:focus-visible,input:focus-visible{outline:3px solid #f0b4a8;outline-offset:2px}
details{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
details summary{cursor:pointer;font-weight:700;font-size:13px}
.rules{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.rules .r{display:flex;flex-direction:column;gap:3px;font-size:12px}
.rules .r span{color:var(--muted)}
.rules input[type=text]{padding:6px;border:1px solid var(--line);border-radius:5px;font:inherit;width:100%}
.opt{display:flex;gap:8px;align-items:center;font-size:13px}
.msg{border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.6}
.msg.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #f3c3bf}
.msg.info{background:#eef4ef;color:var(--ok);border:1px solid #cfe3d3}
.preview{padding:24px;display:flex;flex-direction:column;align-items:center;gap:24px;min-width:0;overflow:auto}
.empty{margin-top:12vh;text-align:center;color:var(--muted);line-height:1.9}
.empty b{color:var(--ink);font-size:18px}
.pagewrap{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pagewrap .cap{font-size:12px;color:var(--muted)}

/* ============ A4横シート（テンプレート再現） ============ */
.sheet{width:297mm;height:210mm;background:#fff;position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.15);font-family:var(--jp);color:#000}
.sheet .badge{position:absolute;top:7mm;right:12mm;width:33mm;height:33mm;object-fit:contain}
.sheet .title{position:absolute;left:0;right:0;top:10mm;text-align:center;font-size:40px;font-weight:900;letter-spacing:.04em}
.sheet .rule{position:absolute;left:20mm;right:52mm;top:28mm;height:0;border-top:2.2px solid var(--red-deep)}
.sheet .lead{position:absolute;left:0;right:0;top:31mm;text-align:center;font-size:12.5px;font-weight:700}
.t-banner{position:absolute;left:14mm;top:41mm;width:125mm;height:15mm;border-radius:4mm;background:var(--red);border:1px solid #ff0;color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;letter-spacing:.03em}
.t-nlbc{position:absolute;left:144mm;right:14mm;top:40mm;height:17mm;display:flex;flex-direction:column;justify-content:center;font-size:11px;font-weight:700;line-height:1.5}
.t-nlbc .u{color:#1155cc}
.t-table{position:absolute;left:14mm;right:14mm;top:60mm;border-collapse:collapse;table-layout:fixed;width:269mm}
.t-table th,.t-table td{border:1.2px solid #000;text-align:center;vertical-align:middle;font-weight:800;overflow:hidden;white-space:nowrap}
.t-table th{height:11mm;font-size:15px;background:#fff}
.t-table td{font-size:var(--fs,20px);height:var(--rh,13mm);font-variant-numeric:tabular-nums;letter-spacing:.02em;padding:0 2mm}
.t-table td.menu{text-align:left;padding-left:5mm}
.t-table td.bad{color:var(--warn);background:var(--warn-bg)}
.t-note{position:absolute;left:14mm;right:14mm;top:var(--notetop,163mm);font-size:12px;font-weight:700}
/* トレサ表は5行固定・全体を拡大 */
.tor .badge{top:5mm;right:10mm;width:37mm;height:37mm}
.tor .title{top:8mm;right:46mm;left:6mm;font-size:48px;letter-spacing:.02em}
.tor .rule{top:27mm;left:18mm;right:50mm;border-top-width:2.6px}
.tor .lead{top:30mm;right:40mm;font-size:16px}
.tor .t-banner{top:39mm;height:18mm;width:140mm;font-size:30px;border-radius:5mm}
.tor .t-nlbc{left:160mm;top:38mm;height:20mm;font-size:14.5px;line-height:1.45}
.tor .t-table{top:61mm}
.tor .t-table th{height:13mm;font-size:21px}
.tor .t-table td{height:17mm;font-size:30px}
.tor .t-table td.menu{padding-left:6mm}
.tor .t-table td.menu.long{font-size:26px}
.tor .t-note{top:162mm;font-size:15.5px}
.tor .logo{height:24mm;bottom:6mm}
.tor .date{font-size:21px;bottom:10mm}
.tor .store{font-size:10px;bottom:10mm}
.sheet .logo{position:absolute;left:50%;bottom:9mm;transform:translateX(-50%);height:21mm}
.sheet .date{position:absolute;right:16mm;bottom:11mm;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.sheet .store{position:absolute;left:16mm;bottom:11mm;font-size:9px;color:#888}

/* 野菜産地 */
.v-sub{position:absolute;left:0;right:0;top:32mm;text-align:center;font-size:12.5px;font-weight:700}
.v-red{position:absolute;left:30mm;top:41mm;font-size:13px;font-weight:700;color:var(--red-deep)}
.v-table{position:absolute;left:30mm;right:30mm;top:49mm;width:237mm;border-collapse:collapse;table-layout:fixed}
.v-table th{height:17mm;padding:0 2mm}
.v-table th span{display:flex;align-items:center;justify-content:center;height:11mm;border-radius:2.5mm;background:var(--red-deep);color:#fff;font-size:17px;font-weight:900}
.v-table td{height:14.5mm;border-top:1px solid #000;text-align:center;font-size:20px;font-weight:800}
.v-table td.note{font-size:13px}
.v-table tr:last-child td{border-bottom:1px solid #000}

@media (max-width:860px){.app{grid-template-columns:1fr}.panel{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.preview{align-items:flex-start}}

@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff}
  .panel,.cap,.empty{display:none!important}
  .app{display:block}
  .preview{padding:0;gap:0;display:block;overflow:visible}
  .pagewrap{display:block}
  .sheet{box-shadow:none;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pagewrap:last-child .sheet:last-child{page-break-after:auto;break-after:auto}
  .t-table td.bad{background:#fff}
}

/* 公開状態・本社担当者欄 */
.status{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.55;font-size:13px}
.status b{font-size:14px}
.status span{color:var(--muted);font-size:12px}
.status .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px;background:#bdb3af}
.status.ok{border-color:#cfe3d3}.status.ok .dot{background:var(--ok)}
.status.draft{border-color:#f0c48a;background:#fff8ee}.status.draft .dot{background:#d98a14}
.status.err{border-color:#f3c3bf}.status.err .dot{background:var(--warn)}
.hint{font-size:11.5px;color:var(--muted)}
.hq{border-color:#cdbfba}
.hq summary{color:var(--ink)}
.hqbody{display:flex;flex-direction:column;gap:16px;margin-top:12px}
.pass{padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit}
.btn.publish{background:var(--ink);color:#fff}
.btn.publish:disabled{background:#c9bfbc;cursor:not-allowed}
.cap .tag{margin-left:8px;background:#d98a14;color:#fff;border-radius:4px;padding:1px 6px;font-size:11px}
@media print{.status{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>トレサ表メーカー<small>店別の国産牛肉トレーサビリティ表（A4横）</small></h1>

    <div class="status" id="status"><span class="dot"></span><div><b>最新データを読み込んでいます…</b></div></div>

    <div id="warnbox"></div>

    <div class="step">
      <label class="t">① 店舗を選ぶ</label>
      <div class="row2"><button class="btn sub" id="allOn" type="button">すべて選択</button><button class="btn sub" id="allOff" type="button">すべて解除</button></div>
      <div class="stores" id="stores"><span class="none" style="padding:6px">データを読み込むと店舗が表示されます</span></div>
      <div class="hint">選んだ店舗はこのパソコンに記憶されます。</div>
    </div>

    <div class="step">
      <label class="t">② 印刷する</label>
      <label class="opt"><input type="checkbox" id="optVeg" checked>野菜産地のページも印刷する</label>
      <label class="opt"><input type="checkbox" id="optStore" checked>用紙の左下に店舗名を小さく入れる</label>
      <div class="row2" style="font-size:13px">表示日付 <input type="date" id="issue" aria-label="表示日付"></div>
      <button class="btn primary" id="print" type="button" disabled>印刷する（A4横）</button>
    </div>

    <details class="hq" id="hq">
      <summary>本社担当者用：今週のデータを更新</summary>
      <div class="hqbody">
        <div class="step">
          <label class="t" for="file">1. 出荷明細CSVを読み込む</label>
          <div class="drop" id="drop"><b>ここにCSVをドロップ</b><br>またはクリックして選択<br><span class="fname">syuka_meisai〜.csv</span></div>
          <input type="file" id="file" accept=".csv,text/csv" hidden>
          <div class="fname" id="fname"></div>
        </div>
        <div class="step">
          <label class="t">2. 対象期間（納品日）</label>
          <div class="row2"><input type="date" id="dFrom" aria-label="開始日">〜<input type="date" id="dTo" aria-label="終了日"></div>
        </div>
        <div class="step">
          <label class="t">3. メニュー名（変更時のみ）</label>
          <div class="rules" id="rules"></div>
          <div class="row2"><button class="btn sub" id="resetRules" type="button">初期値に戻す</button></div>
        </div>
        <div class="step">
          <label class="t" for="pass">4. 全店に公開する</label>
          <input type="password" id="pass" class="pass" placeholder="更新用パスコード" autocomplete="off">
          <button class="btn publish" id="publish" type="button" disabled>この内容で全店に公開する</button>
          <div id="pubmsg"></div>
        </div>
      </div>
    </details>
  </aside>

  <main class="preview" id="preview">
    <div class="empty"><b>最新データを読み込んでいます</b><br>店舗を選ぶと、トレサ表（A4横）のプレビューがここに並びます。</div>
  </main>
</div>

/* 紐づけルール：key＝原料名（空白を除いて部分一致）、type＝印字する番号 */
const DEFAULT_RULES = [
  {id:'karubi', key:'和牛トモバラ',        menu:'和牛特選カルビ・和牛カルビ',     type:'id'},
  {id:'loin',   key:'和牛厚切サーロイン',  menu:'特選厚切りサーロイン',           type:'lot'},
  {id:'mille',  key:'セナラミルフィーユ',  menu:'お出汁で食べる和牛ミルフィーユ', type:'lot'},
  {id:'yukke',  key:'和牛冷凍ユッケ肉',    menu:'和牛ユッケ',                     type:'id'},
];
/* 野菜産地（固定） */
const VEG = [
  ['サニーレタス','国産','長野県',''],
  ['白菜','国産','兵庫県',''],
  ['サンチュ','国産','千葉県',''],
  ['シイタケ','国産','山形県',''],
  ['大根','国産','青森県',''],
  ['米','国産','福島県','会津産ひとめぼれ'],
];

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s??'').normalize('NFKC').replace(/\s+/g,'');
const ymdToIso = v => /^\d{8}$/.test(v)?`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`:'';
const isoToYmd = v => (v||'').replace(/-/g,'');
const ymdSlash = v => /^\d{8}$/.test(v)?`${v.slice(0,4)}/${+v.slice(4,6)}/${+v.slice(6,8)}`:'';
const todayIso = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const apiReady = () => /^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL);

const store_ = { get(k){ try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null} },
                 set(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} } };

let rules = DEFAULT_RULES.map(r=>({...r}));
let data = null;        // 表示中のデータ {recs, stores, from, to, fileName, savedAt}
let published = null;   // 公開中のデータ
let draft = false;      // true＝本社担当者が読み込んだ未公開のCSVを表示中
let selected = new Set(store_.get('toresa_stores')||[]);

function applyRules(saved){
  rules = DEFAULT_RULES.map(r=>({...r, menu:(saved&&saved.find(x=>x.id===r.id)||{}).menu||r.menu}));
  renderRules();
}
function renderRules(){
  $('#rules').innerHTML = rules.map((r,i)=>`<div class="r"><span>原料名「${esc(r.key)}」→ ${r.type==='id'?'個体識別番号':'ロットNo'}</span>
    <input type="text" id="rule_${r.id}" data-i="${i}" value="${esc(r.menu)}" aria-label="${esc(r.key)}のメニュー名"></div>`).join('');
  $('#rules').querySelectorAll('input').forEach(inp=>inp.addEventListener('input',e=>{
    rules[+e.target.dataset.i].menu=e.target.value; markDraft(); render();
  }));
}

/* ---- 状態表示 ---- */
function setStatus(kind, html){
  const el=$('#status'); el.className='status '+kind; el.innerHTML=`<span class="dot"></span><div>${html}</div>`;
}
function fmtSaved(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return '';
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function showPublishedStatus(){
  if(!published){ setStatus('empty','<b>まだデータが公開されていません</b><br>本社担当者の更新をお待ちください。'); return; }
  setStatus('ok',`<b>${ymdSlash(published.from)}〜${ymdSlash(published.to)} 納品分</b><br><span>${fmtSaved(published.savedAt)} 更新</span>`);
}
function markDraft(){
  if(!data) return;
  draft=true;
  setStatus('draft',`<b>未公開のプレビュー</b><br><span>${esc(data.fileName||'')}　確認後「全店に公開する」を押してください</span>`);
  updatePublishBtn();
}

/* ---- 公開データの取得・保存（Google Apps Script） ---- */
async function fetchPublished(){
  if(!apiReady()){ setStatus('empty','<b>保存先が未設定です</b><br>本社担当者用からCSVを読み込むと、このパソコンだけで表示できます。'); return; }
  try{
    const res=await fetch(API_URL+(API_URL.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||'読み込みに失敗しました');
    published=j.data||null;
    if(draft) return;
    if(published){ data=published; applyRules(published.rules); setRange(published.from,published.to); }
    showPublishedStatus(); render();
  }catch(e){
    setStatus('err',`<b>データを読み込めませんでした</b><br><span>通信状況を確認して、ページを再読み込みしてください。</span>`);
  }
}
async function publish(){
  const btn=$('#publish'), msg=$('#pubmsg');
  if(!data||!draft) return;
  const from=isoToYmd($('#dFrom').value), to=isoToYmd($('#dTo').value);
  const recs=data.recs.filter(x=>(!from||x.date>=from)&&(!to||x.date<=to));
  const payload={...data, recs, from, to, rules:rules.map(r=>({id:r.id,menu:r.menu}))};
  btn.disabled=true; btn.textContent='公開しています…'; msg.innerHTML='';
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({key:$('#pass').value, data:payload})});
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||'公開できませんでした');
    published={...payload, savedAt:j.savedAt}; data=published; draft=false;
    showPublishedStatus(); render();
    msg.innerHTML=`<div class="msg info">全店に公開しました。各店はページを開くだけで最新のトレサ表を印刷できます。</div>`;
    btn.textContent='この内容で全店に公開する'; updatePublishBtn();
  }catch(e){
    btn.textContent='この内容で全店に公開する'; updatePublishBtn();
    msg.innerHTML=`<div class="msg warn">${esc(e.message==='Failed to fetch'?'通信できませんでした。ネットワークを確認してもう一度押してください。':e.message)}</div>`;
  }
}
function updatePublishBtn(){
  const btn=$('#publish');
  const bad=data?data.stores.reduce((n,s)=>n+buildStore(s.name).bad,0):0;
  btn.disabled = !(draft && data && apiReady() && bad===0);
  if(!apiReady()&&draft) $('#pubmsg').innerHTML='<div class="msg warn">保存先が未設定のため公開できません。</div>';
  else if(bad&&draft) $('#pubmsg').innerHTML='<div class="msg warn">番号が壊れているCSVは公開できません。Excelで開いていないCSVを出力し直してください。</div>';
  else if(draft) $('#pubmsg').innerHTML='';
}

/* ---- CSV ---- */
function parseCSV(text){
  const out=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); out.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); out.push(row); }
  return out.filter(r=>r.some(v=>v.trim()!==''));
}
function decode(buf){
  for(const enc of ['shift_jis','utf-8']){
    try{ const t=new TextDecoder(enc,{fatal:false}).decode(buf).replace(/^﻿/,''); if(t.includes('原料名')) return t; }catch(e){}
  }
  return null;
}
function load(buf, name){
  const text=decode(buf);
  if(!text){ showWarn(['このファイルは出荷明細CSVとして読み込めませんでした。「原料名」列のあるCSVを選んでください。']); return; }
  const rows=parseCSV(text); const head=rows.shift().map(h=>h.trim());
  const col = n => head.indexOf(n);
  const need=['納品日','販売先コード','販売先名','原料名','個体識別番号'];
  const lotCol = head.findIndex(h=>/^ロット/.test(h));
  const miss=need.filter(n=>col(n)<0); if(lotCol<0) miss.push('ロット№');
  if(miss.length){ showWarn([`必要な列が見つかりません：${miss.join('、')}`]); return; }
  const all=rows.map(r=>({
    date:(r[col('納品日')]||'').trim(), code:(r[col('販売先コード')]||'').trim(), store:(r[col('販売先名')]||'').trim(),
    mat:norm(r[col('原料名')]), id:(r[col('個体識別番号')]||'').trim(), lot:(r[lotCol]||'').trim()
  })).filter(r=>r.store);
  const storeMap=new Map(); all.forEach(r=>{ if(!storeMap.has(r.store)) storeMap.set(r.store,r.code); });
  const stores=[...storeMap].map(([name,code])=>({name,code})).sort((a,b)=>(+a.code||0)-(+b.code||0)||a.name.localeCompare(b.name,'ja'));
  const keys=DEFAULT_RULES.map(r=>norm(r.key));
  const recs=all.filter(x=>keys.some(k=>x.mat.includes(k)));   // トレサ表に使う原料だけ保持
  const dates=all.map(r=>r.date).filter(d=>/^\d{8}$/.test(d)).sort();
  data={recs,stores,fileName:name,from:dates[0]||'',to:dates[dates.length-1]||''};
  $('#fname').textContent=`読込済み：${name}（${all.length}行）`;
  setRange(data.from,data.to);
  if(!selected.size) selected=new Set(stores.filter(s=>buildStore(s.name).count>0).map(s=>s.name));
  markDraft(); render();
}
function setRange(from,to){ $('#dFrom').value=ymdToIso(from||''); $('#dTo').value=ymdToIso(to||''); }

/* ---- 集計 ---- */
function buildStore(store){
  const from=isoToYmd($('#dFrom').value), to=isoToYmd($('#dTo').value);
  const lines=[]; let bad=0;
  rules.forEach(r=>{
    const k=norm(r.key);
    const hits=data.recs.filter(x=>x.store===store && x.mat.includes(k) && (!from||x.date>=from) && (!to||x.date<=to));
    const seen=new Map();
    hits.forEach(x=>{ const v=(r.type==='id'?x.id:x.lot); if(!v) return;
      if(!seen.has(v)||seen.get(v)<x.date) seen.set(v,x.date); });
    [...seen].sort((a,b)=>b[1].localeCompare(a[1])||a[0].localeCompare(b[0])).forEach(([v])=>{
      const broken=/e[+-]?\d/i.test(v);
      if(broken) bad++;
      lines.push({rule:r.id, date:seen.get(v), menu:r.menu, id:r.type==='id'?v:'', lot:r.type==='lot'?v:'', broken});
    });
  });
  return {lines,count:lines.length,bad};
}

/* ---- 描画 ---- */
function fmtDate(iso){ return iso?iso.replace(/-/g,'/'):''; }
const MAX_ROWS=5;
/* 5行に収める：まず各メニューの最新番号を1つずつ、残りの枠を新しい順で埋める */
function pickRows(lines){
  if(lines.length<=MAX_ROWS) return lines;
  const chosen=new Set();
  rules.forEach(r=>{ const first=lines.find(l=>l.rule===r.id); if(first&&chosen.size<MAX_ROWS) chosen.add(first); });
  [...lines].sort((a,b)=>b.date.localeCompare(a.date)).forEach(l=>{ if(chosen.size<MAX_ROWS) chosen.add(l); });
  return lines.filter(l=>chosen.has(l));
}
function torSheet(store,b){
  const rows=[...pickRows(b.lines)]; while(rows.length<MAX_ROWS) rows.push({menu:'',id:'',lot:''});
  return `<div class="sheet tor">
    <img class="badge" src="${IMG_BADGE}" alt="">
    <div class="title">国産牛肉トレーサビリティ実施店</div>
    <div class="rule"></div>
    <div class="lead">お客様に安心して召し上がっていただけるよう当店では牛肉のトレーサビリティに取り組んでいます。</div>
    <div class="t-banner">国産牛肉トレーサビリティー</div>
    <div class="t-nlbc"><div>個体識別番号の全国データベースへの<br>アクセス方法</div><div>URL:　<span class="u">https://www.nlbc.go.jp/</span></div></div>
    <table class="t-table"><colgroup><col style="width:50%"><col style="width:25%"><col style="width:25%"></colgroup>
      <thead><tr><th>メニュー名</th><th>個体識別番号</th><th>ロット番号</th></tr></thead>
      <tbody>${rows.map(l=>`<tr><td class="menu${(l.menu||'').length>13?' long':''}">${esc(l.menu)}</td><td class="${l.broken&&l.id?'bad':''}">${esc(l.id)}</td><td class="${l.broken&&l.lot?'bad':''}">${esc(l.lot)}</td></tr>`).join('')}</tbody>
    </table>
    <div class="t-note">　ロット番号で表示されているメニューは牛肉トレーサビリティー法に基づき個体識別番号が管理されております。</div>
    <img class="logo" src="${IMG_LOGO}" alt="焼肉セナラ">
    ${$('#optStore').checked?`<div class="store">${esc(store)}</div>`:''}
    <div class="date">${fmtDate($('#issue').value)}</div>
  </div>`;
}
function vegSheet(store){
  return `<div class="sheet">
    <img class="badge" src="${IMG_BADGE}" alt="">
    <div class="title" style="top:12mm">主要食材の原産地紹介</div>
    <div class="v-sub">お客様に安心して召し上がっていただけるよう当店では、主要食材の原産地表示に取り組んでいます。</div>
    <div class="v-red">当店が提供する主要食材の原産地表示</div>
    <table class="v-table">
      <thead><tr><th><span>産地名</span></th><th><span>原産国種別</span></th><th><span>産地名</span></th><th><span>備考</span></th></tr></thead>
      <tbody>${VEG.map(v=>`<tr><td>${esc(v[0])}</td><td>${esc(v[1])}</td><td>${esc(v[2])}</td><td class="note">${esc(v[3])}</td></tr>`).join('')}</tbody>
    </table>
    ${$('#optStore').checked?`<div class="store">${esc(store)}</div>`:''}
    <div class="date">${fmtDate($('#issue').value)}</div>
  </div>`;
}

function showWarn(list,info){
  $('#warnbox').innerHTML = list.length?`<div class="msg ${info?'info':'warn'}">${list.map(esc).join('<br>')}</div>`:'';
}

function render(){
  if(!data){ $('#print').disabled=true; return; }
  const built=new Map(data.stores.map(s=>[s.name,buildStore(s.name)]));
  $('#stores').innerHTML=data.stores.map((s,i)=>{const b=built.get(s.name);
    return `<label class="${b.count?'':'none'}"><input type="checkbox" id="st_${i}" data-n="${esc(s.name)}" ${selected.has(s.name)?'checked':''}>${esc(s.name)}<span class="cnt">${b.count?b.count+'件':'該当なし'}</span></label>`}).join('');
  $('#stores').querySelectorAll('input').forEach(c=>c.addEventListener('change',e=>{
    e.target.checked?selected.add(e.target.dataset.n):selected.delete(e.target.dataset.n); store_.set('toresa_stores',[...selected]); render();
  }));
  const targets=data.stores.filter(s=>selected.has(s.name));
  let badTotal=0; targets.forEach(s=>{ badTotal+=built.get(s.name).bad; });
  showWarn(badTotal?[`番号が「2.61E+11」のような指数表記に変わっていて、正しいロット番号が読めません（${badTotal}件・赤字の箇所）。CSVを一度Excelで開いて保存すると桁が失われます。システムから出力したCSVを開かずにそのまま読み込んでください。`]:[]);
  $('#print').disabled = targets.length===0;
  $('#print').textContent = targets.length?`印刷する（${targets.length}店舗・A4横 ${targets.length*($('#optVeg').checked?2:1)}枚）`:'印刷する店舗を選んでください';
  $('#preview').innerHTML = targets.length? targets.map(s=>`<div class="pagewrap"><div class="cap">${esc(s.name)}${draft?'<span class="tag">未公開</span>':''}</div>${torSheet(s.name,built.get(s.name))}${$('#optVeg').checked?vegSheet(s.name):''}</div>`).join('')
    : `<div class="empty"><b>店舗が選ばれていません</b><br>左の「① 店舗を選ぶ」で自分の店にチェックを入れてください。</div>`;
  if(draft) updatePublishBtn();
}

/* ---- イベント ---- */
const drop=$('#drop'), file=$('#file');
drop.addEventListener('click',()=>file.click());
file.addEventListener('change',()=>{ const f=file.files[0]; if(f) f.arrayBuffer().then(b=>load(b,f.name)); file.value=''; });
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove('on')));
drop.addEventListener('drop',e=>{e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) f.arrayBuffer().then(b=>load(b,f.name));});
['#issue','#optVeg','#optStore'].forEach(s=>$(s).addEventListener('change',render));
['#dFrom','#dTo'].forEach(s=>$(s).addEventListener('change',()=>{ markDraft(); render(); }));
$('#allOn').addEventListener('click',()=>{ if(data){ selected=new Set(data.stores.map(s=>s.name)); store_.set('toresa_stores',[...selected]); render(); }});
$('#allOff').addEventListener('click',()=>{ selected.clear(); store_.set('toresa_stores',[]); render(); });
$('#resetRules').addEventListener('click',()=>{ applyRules(null); markDraft(); render(); });
$('#publish').addEventListener('click',publish);
$('#print').addEventListener('click',()=>window.print());
$('#issue').value=todayIso();
renderRules();
fetchPublished();
</script>
</body>
